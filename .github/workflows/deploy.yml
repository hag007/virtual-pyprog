name: deploy-book

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-book:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Python toolchain (pinned)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Notebook cache (optional)
      - name: cache executed notebooks
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

      # Diagnostics (helps when things drift)
      - name: Diagnostics
        run: |
          set -euxo pipefail
          echo "PWD=$(pwd)"
          python --version
          pip --version
          which jupyter-book || true
          jupyter-book --version || true
          ls -la
          test -f _config.yml || echo "::warning::_config.yml not found at repo root"
          test -f _toc.yml || test -f _toc.toml || echo "::warning::_toc file not found"

      # Build (verbose; keep going to surface all errors)
      - name: Build the book
        run: jupyter-book build . --keep-going -vvv

      # Validate site dir to avoid directory/file mixups
      - name: Validate site dir
        run: |
          set -e
          test -d _build/html || (echo "::error::_build/html missing"; exit 1)
          test -f _build/html/index.html || (echo "::error::index.html missing in _build/html"; exit 1)
          if [ -d _build/html/CNAME ]; then
            echo "::error::CNAME is a directory but must be a file"; exit 1
          fi

      # Upload artifact for Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

