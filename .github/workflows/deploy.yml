name: deploy-book

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-book:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Detect whether the book is at repo root or in docs/
      - name: Detect book directory
        id: detect
        run: |
          set -eux
          if [ -f "_config.yml" ]; then
            BOOK_DIR="."
          elif [ -f "docs/_config.yml" ]; then
            BOOK_DIR="docs"
          else
            echo "::error::No _config.yml found in repo root or docs/"; ls -la; exit 1
          fi
          echo "Book dir is: ${BOOK_DIR}"
          
          cd ${BOOK_DIR}

          echo "PWD=$(pwd)"
          echo "BOOK_DIR=$BOOK_DIR"
          python --version
          pip --version
          which jupyter-book || true
          jupyter-book --version || true
          ls -la "$BOOK_DIR"
          test -f "$BOOK_DIR/_config.yml" || (echo "::error::_config.yml missing"; exit 1)
          test -f "$BOOK_DIR/_toc.yml" -o -f "$BOOK_DIR/_toc.toml" || echo "::warning::_toc not found"

          jupyter-book build . --keep-going -vvv 2>&1 | tee ../jb-build.log

          test -d _build/html || (echo "::error::_build/html missing"; exit 1)
          test -f _build/html/index.html || (echo "::error::index.html missing in _build/html"; exit 1)
          if [ -d _build/html/CNAME ]; then
            echo "::error::CNAME is a directory but must be a file"; exit 1
          fi

      # Always upload the build log so you can see Sphinx/JB errors
      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jb-build-log
          path: jb-build.log
          if-no-files-found: warn

      # Upload site to Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BOOK_DIR }}/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

